version: '3.3'

services:
  dns-resolver:
    image: coredns/coredns:latest
    container_name: dns-resolver
    volumes:
      - ./coredns:/root/
    command: -conf /root/Corefile
    networks:
      bor-net:
        ipv4_address: 10.5.0.10

  bor-box:
    image: python:3.10-slim
    container_name: bor-box
    volumes:
      - ./borbox:/app
    working_dir: /app
    environment:
      - UPSTREAM_DNS=10.5.0.10
      - BORBOX_ENABLED=true
    networks:
      bor-net:
        ipv4_address: 10.5.0.20
    # Keeps container alive until we write the proxy script
    command: tail -f /dev/null 

  attacker:
    image: python:3.10-slim
    container_name: attacker
    volumes:
      - ./attacker:/app
    working_dir: /app
    depends_on:
      - bor-box
    networks:
      bor-net:
        ipv4_address: 10.5.0.30
    # Keeps container alive for executing attack scripts
    command: tail -f /dev/null

  client:
    image: python:3.10-slim
    container_name: client
    volumes:
      - ./client:/app
    working_dir: /app
    depends_on:
      - bor-box
    networks:
      bor-net:
        ipv4_address: 10.5.0.40
    # Keeps container alive for executing benchmark scripts
    command: tail -f /dev/null

networks:
  bor-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.5.0.0/24
